<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center px-4">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome Back 👋</h2>
    
    <div id="error" class="text-red-500 text-sm mb-4 hidden text-center">❌ Incorrect username or password.</div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label for="username" class="block text-gray-700 font-semibold mb-1">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter your username"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-500 outline-none"
          required
        />
      </div>
      
      <div>
        <label for="password" class="block text-gray-700 font-semibold mb-1">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-500 outline-none"
          required
        />
      </div>

      <button
        type="submit"
        class="w-full bg-purple-600 text-white font-bold py-2 px-4 rounded hover:bg-purple-700 transition duration-300"
      >
        Login
        <link rel="stylesheet" href="index.html">
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const result = await res.json();
      if (result.success) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('error').classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
